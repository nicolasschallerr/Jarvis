# Configuración estructural del cliente. Todos los datos son INVENTADOS.
# Formato: YAML (admite comentarios). Se validará con un esquema en la Fase 5.

organizacion:
  slug: cooperativa-ejemplo          # identificador estable, minúsculas y guiones
  nombre: Cooperativa Ejemplo
  nombre_agente: Sofía
  zona_horaria: America/Argentina/Buenos_Aires

horario_atencion:
  # Fuera de este horario el agente toma la consulta completa y la deja en la cola del sector.
  dias: [lunes, martes, miercoles, jueves, viernes]
  desde: "08:00"
  hasta: "15:00"
  feriados: []                       # DECISIÓN PENDIENTE: lista de feriados propios del cliente

unidades:
  - id: creditos                     # coincide con conocimiento/creditos.md
    nombre: Créditos
    sector: creditos
  - id: viajes
    nombre: Viajes
    sector: viajes

sectores:
  - id: creditos
    nombre: Créditos
    responsables:
      - nombre: Responsable Ficticio Uno   # nunca datos reales en la plantilla
        email: creditos@ejemplo.test
  - id: viajes
    nombre: Viajes
    responsables:
      - nombre: Responsable Ficticio Dos
        email: viajes@ejemplo.test
  - id: atencion-general
    nombre: Atención general
    responsables:
      - nombre: Responsable Ficticio Tres
        email: atencion@ejemplo.test

derivacion:
  sector_por_defecto: atencion-general   # cuando no se identifica la unidad
  incluir_resumen_ia: true

temas_sensibles:
  # El agente deriva sin intentar resolver.
  - id: seguridad-cuenta
    descripcion: Accesos no reconocidos, transferencias no reconocidas, robo de credenciales
    sector: atencion-general
    prioridad: alta
  - id: reclamo-formal
    descripcion: Reclamos, quejas formales o pedidos de baja
    sector: atencion-general
    prioridad: normal

campos:
  # Datos que el agente junta. Cada uno se valida con su regex antes de guardarse (datos inventados).
  #   guardar_en: contacto_nombre | contacto_documento | contacto_localidad | caso (por defecto)
  #   limpiar: digitos  quita puntos y espacios antes de validar (ej. "12.345.678" -> "12345678")
  #   unidades: en qué unidades se pide (sin esto, en todas)
  #   obligatorio: si falta, el agente no deriva (salvo temas sensibles o pedido de hablar con una persona)
  - id: nombre
    etiqueta: Nombre y apellido
    regex: '^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,60}$'
    ayuda: Escribí nombre y apellido, solo con letras.
    guardar_en: contacto_nombre
  - id: dni
    etiqueta: DNI
    limpiar: digitos
    regex: '^\d{7,8}$'
    ayuda: Escribí el DNI solo con números, de 7 u 8 dígitos.
    guardar_en: contacto_documento
  - id: localidad
    etiqueta: Localidad
    regex: '^[A-Za-z0-9ÁÉÍÓÚáéíóúÑñ ]{2,50}$'
    ayuda: Escribí tu localidad o ciudad.
    guardar_en: contacto_localidad
  - id: telefono
    etiqueta: Teléfono de contacto
    limpiar: digitos
    regex: '^\d{8,15}$'
    ayuda: Escribí tu teléfono solo con números y con el código de área.
    desde_canal: true                # por WhatsApp se toma del número del chat: no se pide
  - id: monto
    etiqueta: Monto solicitado
    limpiar: digitos
    regex: '^\d{4,9}$'
    ayuda: Escribí el monto solo con números, sin símbolos.
    unidades: [creditos]
  - id: email
    etiqueta: Correo electrónico
    regex: '^[^@\s]+@[^@\s]+\.[^@\s]{2,}$'
    ayuda: Escribí un correo válido, por ejemplo nombre@dominio.com.
    unidades: [viajes]
    obligatorio: false

validacion:
  reintentos_por_campo: 3          # tras 3 intentos fallidos con un dato, el agente deriva a una persona
  datos_por_mensaje: 3             # cuántos datos puede pedir juntos en un mismo mensaje (1 = de a uno)

seguimientos:
  # Recordatorios automáticos cuando una gestión queda a medias (fuera de la ventana de 24 h: solo plantillas).
  activo: true
  horas: [24, 48, 72]
  # Plantilla aprobada en Meta para escribir fuera de la ventana (se sincroniza en /plantillas). Variables: {{1}} o
  # {{nombre}} = nombre del contacto, {{2}} o {{nombre_agente}}, {{3}} o {{nombre_organizacion}} (ADR-030).
  plantilla: recordatorio_gestion_pendiente

textos_editables:
  # El cliente puede cambiarlos desde el CRM.
  # Menú principal: el sistema lo envía tal cual cuando el asociado escribe MENÚ, sin pasar por el modelo.
  menu_principal: |-
    Menú principal:
    1 · Créditos
    2 · Viajes
    3 · Hablar con un asesor
  # Mensaje de los seguimientos (dentro de la ventana de 24 h). Admite {{nombre_agente}} y {{nombre_organizacion}}.
  seguimiento: >-
    Hola, soy {{nombre_agente}} de {{nombre_organizacion}}. Te escribo por tu consulta, que quedó
    pendiente. ¿Querés que sigamos? Si ya no lo necesitás, avisanos y la cerramos.
  mensaje_fuera_de_horario: >-
    ¡Gracias por escribirnos! Ya tomé tu consulta. Nuestro equipo atiende de lunes a viernes
    de 8 a 15 h y te va a responder por este mismo chat.
  mensaje_derivacion: >-
    Listo, ya le pasé tu consulta al equipo de {{sector}}. Te van a responder por acá.

agentes:
  # Cómo se llaman los agentes en el CRM y qué frase los acompaña (datos inventados).
  - tipo: atencion          # atiende a los afiliados
    nombre: Sofía
    frase: "Estoy para ayudarte con tus consultas."
  - tipo: analitico         # responde preguntas sobre los datos
    nombre: Mateo
    frase: "Los números cuentan una historia."

catalogo:
  # Stock que consulta el agente (ADR-043). Si está activo, el agente busca en él antes de responder sobre
  # disponibilidad, precios o características. Encenderlo o apagarlo después se hace desde Agentes → Stock (ADR-046).
  activo: false
  nombre: productos              # cómo se llama lo que hay en el catálogo, en plural (ej. propiedades)
  # De dónde lo lee el CRM solo (ADR-047). El cliente no conecta nada: lo configura Orbita AI acá.
  # Después de cargar la configuración, para leerlas ya: scripts/sincronizar-stock.mts --org-slug <slug>
  fuentes: []
  # Ejemplos:
  #   - tipo: supabase              # la base Supabase del cliente, de solo lectura
  #     nombre: Base de la tienda
  #     url: https://<proyecto>.supabase.co
  #     tabla: products
  #     clave_env: CATALOGO_MITIENDA_KEY   # la CLAVE va en Vercel y en el .env con ese nombre, NUNCA en este archivo
  #     columnas: { stock: cantidad_disponible }   # opcional: solo si una columna tiene un nombre que no se reconoce
  #     cada_horas: 1
  #   - tipo: web                   # Shopify, WooCommerce o cualquier tienda con mapa del sitio y datos de producto
  #     nombre: Tienda online
  #     url: https://mitienda.com.ar
  #     cada_horas: 6
  #   - tipo: planilla              # Google Sheets compartida "cualquiera con el enlace puede ver"
  #     nombre: Lista de precios
  #     url: https://docs.google.com/spreadsheets/d/<id>/edit
  #     cada_horas: 6

ia:
  # Modelo del agente de atención (opcional; por defecto el perfil intermedio de Jarvis).
  modelo_atencion: claude-sonnet-5-5
  # Precios en USD por millón de tokens (opcional). Sin ellos no se calcula el costo de cada llamada.
  # Verificarlos en la documentación oficial de Anthropic antes de cargarlos.
  # precio_entrada_usd_por_millon: 0
  # precio_salida_usd_por_millon: 0
